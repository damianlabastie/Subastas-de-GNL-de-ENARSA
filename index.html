<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Subastas ENARSA</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background:#fff; color:#222; }
h1 { font-size: 20px; margin-bottom:4px; }
h2 { font-size: 16px; margin:0 0 10px 0; color:#222; }
.subtitle { font-size:12px; color:#777; margin-bottom:18px; }
.tabs { display:flex; gap:8px; margin-bottom:18px; border-bottom:2px solid #eee; flex-wrap:wrap; }
.tabBtn { padding:9px 18px; cursor:pointer; font-size:14px; font-weight:600; color:#777; background:none; border:none; border-bottom:3px solid transparent; }
.tabBtn.active { color:#185FA5; border-bottom:3px solid #378ADD; }
.dateContent { display:none; }
.dateContent.active { display:block; }
.kpiRow { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.kpiCard { flex:1; min-width:150px; background:#f7f9fc; border:1px solid #e4e9f0; border-radius:8px; padding:12px 14px; }
.kpiLabel { font-size:11px; color:#777; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
.kpiValue { font-size:20px; font-weight:700; color:#185FA5; }
.kpiSub { font-size:11px; color:#999; margin-top:2px; }
.panel { border:1px solid #e4e9f0; border-radius:8px; padding:16px; margin-bottom:22px; background:#fff; }
.row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
.col { flex:1; min-width:220px; }
label { font-size:12px; color:#555; display:block; margin-bottom:4px; }
button { padding:6px 14px; cursor:pointer; font-size:12px; border:1px solid #ccc; background:#f7f9fc; border-radius:4px; }
button:hover { background:#eef2f7; }
.chartWrap { position:relative; width:100%; height:380px; margin-top:10px; }
.hint { font-size:12px; color:#777; }
.checkBox { height:110px; overflow-y:auto; border:1px solid #ccc; padding:6px; font-size:13px; border-radius:4px;}
.selAllLabel { display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;font-weight:500;border-bottom:1px solid #eee;margin-bottom:4px; font-size:13px;}
.modeLabel { display:flex;align-items:center;gap:4px;font-size:13px;color:#333;cursor:pointer; }
.legend { margin-top:8px; }
table.detailTable { width:100%; border-collapse:collapse; font-size:12px; }
table.detailTable th, table.detailTable td { border-bottom:1px solid #eee; padding:5px 8px; text-align:right; }
table.detailTable th:first-child, table.detailTable td:first-child { text-align:left; }
table.detailTable thead th { background:#f7f9fc; color:#555; font-weight:600; }
table.summaryTable { width:100%; border-collapse:collapse; font-size:13px; }
table.summaryTable th, table.summaryTable td { border-bottom:1px solid #eee; padding:7px 10px; text-align:right; }
table.summaryTable th:first-child, table.summaryTable td:first-child { text-align:left; }
table.summaryTable thead th { background:#f7f9fc; color:#555; font-weight:600; }
</style>
</head>

const PALETTE = ["#378ADD","#D85A30","#1D9E75","#D4537E","#7F77DD","#BA7517","#639922","#888780"];
const fmtNum = n => Math.round(n).toLocaleString('es-AR');
const fmtPrice = n => (n===null || n===undefined) ? '-' : n.toLocaleString('es-AR', {minimumFractionDigits:4, maximumFractionDigits:4});
const fmtHour = h => { if(h===null || h===undefined) return '-'; const hh=Math.floor(h); const mm=Math.round((h-hh)*60); return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); };

const tabsEl = document.getElementById('tabs');
const contentsEl = document.getElementById('contents');
const periodKeys = Object.keys(DATA);

function periodSummary(D){
  let totOf=0, totAs=0, totSin=0, sumPV=0, sumAsPriced=0;
  D.rows.forEach(r=>{ totOf+=r[2]; totAs+=r[3]; totSin+=r[5]; if(r[4]!==null){ sumPV += r[4]*r[3]; sumAsPriced += r[3]; } });
  return { totOf, totAs, totSin, precioProm: sumAsPriced>0 ? sumPV/sumAsPriced : 0, pctAsig: totOf>0 ? totAs/totOf*100 : 0, n: D.rows.length };
}

function parseDDMMYY(s){
  const [d,m,y] = s.split('/').map(Number);
  return new Date(2000 + y, m - 1, d);
}
function periodDays(label){
  const parts = label.split(' al ');
  if(parts.length !== 2) return null;
  const d1 = parseDDMMYY(parts[0].trim());
  const d2 = parseDDMMYY(parts[1].trim());
  return Math.round((d2 - d1) / (1000*60*60*24)) + 1;
}

      <td>${s.n}</td>

  });

    </div>
    <div class="kpiRow">
      ${sums.map(({key,s,days}) => `
        <div class="kpiCard">
          <div class="kpiLabel">${key} &mdash; promedio diario</div>
          <div class="kpiValue">${fmtNum(s.totAs/days)} m&sup3;/día</div>
          <div class="kpiSub">Vol. asignado promedio &middot; Ofertado: ${fmtNum(s.totOf/days)} m&sup3;/día &middot; Sin asignar: ${fmtNum(s.totSin/days)} m&sup3;/día &middot; ${days} días</div>
        </div>
      `).join('')}
    </div>
    <div class="panel">
      <h2>Comparativa de volúmenes por período</h2>
      <div class="chartWrap"><canvas id="chartResumenVol"></canvas></div>
    </div>
    <div class="panel">
      <h2>Comparativa de precio promedio ponderado por período</h2>
      <div class="chartWrap"><canvas id="chartResumenPrecio"></canvas></div>
    </div>
    <div class="panel">
      <h2>Tabla comparativa</h2>
      <table class="summaryTable">
        <thead><tr><th>Período</th><th>Fecha Licitación</th><th>Vol. Ofertado (m&sup3;)</th><th>Vol. Asignado (m&sup3;)</th><th>Vol. Sin asignar (m&sup3;)</th><th>% Asignación</th><th>Precio prom. pond. (USD/MMBTU)</th><th>Cant. ofertas</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
  contentsEl.appendChild(wrap);

  new Chart(document.getElementById('chartResumenVol'), {
    type: 'bar',
    data: {
      labels: sums.map(o=>o.key),
      datasets: [
        {label:'Vol. Ofertado', data: sums.map(o=>o.s.totOf), backgroundColor: PALETTE[0]},
        {label:'Vol. Asignado', data: sums.map(o=>o.s.totAs), backgroundColor: PALETTE[2]},
        {label:'Vol. Sin asignar', data: sums.map(o=>o.s.totSin), backgroundColor: PALETTE[1]}
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: { y: { title:{display:true, text:'Volumen (m3)'}, beginAtZero:true } }
    }
  });

  new Chart(document.getElementById('chartResumenPrecio'), {
    type: 'bar',
    data: {
      labels: sums.map(o=>o.key),
      datasets: [{label:'Precio promedio ponderado', data: sums.map(o=>o.s.precioProm), backgroundColor: PALETTE[3]}]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: { y: { title:{display:true, text:'USD/MMBTU'}, beginAtZero:true } },
      plugins: { legend: { display:false } }
    }
  });
})();

// ---- Tabs por período ----
periodKeys.forEach((dk, idx) => {
  const btn = document.createElement('button');
  btn.className = 'tabBtn';
  btn.textContent = dk;
  btn.dataset.period = dk;
  btn.addEventListener('click', () => selectTab(dk));
  tabsEl.appendChild(btn);

  const wrap = document.createElement('div');
  wrap.className = 'dateContent';
  wrap.id = 'content_' + idx;
  wrap.dataset.period = dk;
  wrap.innerHTML = buildContentHTML(idx);
  contentsEl.appendChild(wrap);
});

function selectTab(pk){
  document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('active', b.dataset.period === pk));
  document.querySelectorAll('.dateContent').forEach(c => c.classList.toggle('active', c.dataset.period === pk));
}

      <div class="chartWrap"><canvas id="chartB_${idx}"></canvas></div>
    </div>

    <div class="panel">
      <h2>Ofertas por hora del día &mdash; Precio vs Hora (tamaño = Vol. Asignado)</h2>
      <div class="row">
        <div class="col">
          <label>Rondas</label>
          <label class="selAllLabel"><input type="checkbox" id="rondaAllC_${idx}"> Seleccionar / deseleccionar todas</label>
          <div class="checkBox" id="rondaBoxC_${idx}"></div>
        </div>
        <div class="col" style="max-width:260px;">
          <label>Modo de visualización</label>
          <label class="modeLabel"><input type="radio" name="modeC_${idx}" id="modeC_ind_${idx}" value="individual" checked> Por ronda (individual)</label>
          <label class="modeLabel"><input type="radio" name="modeC_${idx}" id="modeC_grp_${idx}" value="agrupado"> Agrupado (todas seleccionadas)</label>
          <div style="margin-top:10px;">
            <button id="clearC_${idx}">Limpiar selección</button>
          </div>
        </div>
      </div>
      <div class="legend" id="legendC_${idx}"></div>
      <div class="chartWrap"><canvas id="chartC_${idx}"></canvas></div>
      <div class="hint">El tamaño de cada círculo es proporcional al volumen asignado de la oferta.</div>
    </div>

    <div class="panel">
      <h2>Detalle de ofertas</h2>
      <div style="max-height:320px; overflow-y:auto;">
        <table class="detailTable" id="detailTable_${idx}"></table>
      </div>
    </div>
  `;
}

function makeCheckbox(container, text, value, cls, onChange){
  const label = document.createElement('label');
  label.style.display='flex'; label.style.alignItems='center'; label.style.gap='6px'; label.style.padding='2px 0'; label.style.cursor='pointer';
  const cb = document.createElement('input');
  cb.type='checkbox'; cb.value=value; cb.className=cls;
  cb.addEventListener('change', onChange);
  label.appendChild(cb);
  label.appendChild(document.createTextNode(text));
  container.appendChild(label);
  return cb;
}

const charts = {};

periodKeys.forEach((dk, idx) => {
  const D = DATA[dk];
  const s = periodSummary(D);

  document.getElementById('kpiRow_'+idx).innerHTML = `
    <div class="kpiCard"><div class="kpiLabel">Fecha Licitación</div><div class="kpiValue" style="font-size:16px;">${DATA[dk].fechaLicitacion || 'N/D'}</div><div class="kpiSub">fecha de subasta</div></div>
    <div class="kpiCard"><div class="kpiLabel">Vol. Ofertado</div><div class="kpiValue">${fmtNum(s.totOf)}</div><div class="kpiSub">m&sup3;</div></div>
    <div class="kpiCard"><div class="kpiLabel">Vol. Asignado</div><div class="kpiValue">${fmtNum(s.totAs)}</div><div class="kpiSub">m&sup3;</div></div>
    <div class="kpiCard"><div class="kpiLabel">Vol. Sin asignar</div><div class="kpiValue">${fmtNum(s.totSin)}</div><div class="kpiSub">m&sup3;</div></div>
    <div class="kpiCard"><div class="kpiLabel">% Asignación</div><div class="kpiValue">${s.pctAsig.toFixed(1)}%</div><div class="kpiSub">asignado / ofertado</div></div>
    <div class="kpiCard"><div class="kpiLabel">Precio prom. ponderado</div><div class="kpiValue">${fmtPrice(s.precioProm)}</div><div class="kpiSub">USD/MMBTU</div></div>
    <div class="kpiCard"><div class="kpiLabel">Cant. ofertas</div><div class="kpiValue">${s.n}</div><div class="kpiSub">registros</div></div>
  `;

  const boxA = document.getElementById('rondaBoxA_'+idx);
  D.rondas.forEach((r,i)=> makeCheckbox(boxA, r, i, 'rondaCbA_'+idx, ()=>{ syncSelAll('rondaAllA_'+idx,'rondaCbA_'+idx); renderA(idx); }));
  const boxB = document.getElementById('rondaBoxB_'+idx);
  D.rondas.forEach((r,i)=> makeCheckbox(boxB, r, i, 'rondaCbB_'+idx, ()=>{ syncSelAll('rondaAllB_'+idx,'rondaCbB_'+idx); renderB(idx); }));
  const boxC = document.getElementById('rondaBoxC_'+idx);
  D.rondas.forEach((r,i)=> makeCheckbox(boxC, r, i, 'rondaCbC_'+idx, ()=>{ syncSelAll('rondaAllC_'+idx,'rondaCbC_'+idx); renderC(idx); }));

  document.getElementById('rondaAllA_'+idx).addEventListener('change', (e)=>{
    document.querySelectorAll('.rondaCbA_'+idx).forEach(cb=>cb.checked = e.target.checked);
    renderA(idx);
  });
  document.getElementById('rondaAllB_'+idx).addEventListener('change', (e)=>{
    document.querySelectorAll('.rondaCbB_'+idx).forEach(cb=>cb.checked = e.target.checked);
    renderB(idx);
  });
  document.getElementById('rondaAllC_'+idx).addEventListener('change', (e)=>{
    document.querySelectorAll('.rondaCbC_'+idx).forEach(cb=>cb.checked = e.target.checked);
    renderC(idx);
  });
  document.getElementById('clearA_'+idx).addEventListener('click', ()=>{
    document.querySelectorAll('.rondaCbA_'+idx).forEach(cb=>cb.checked=false);
    document.getElementById('rondaAllA_'+idx).checked=false;
    renderA(idx);
  });
  document.getElementById('clearB_'+idx).addEventListener('click', ()=>{
    document.querySelectorAll('.rondaCbB_'+idx).forEach(cb=>cb.checked=false);
    document.getElementById('rondaAllB_'+idx).checked=false;
    renderB(idx);
  });
  document.getElementById('clearC_'+idx).addEventListener('click', ()=>{
    document.querySelectorAll('.rondaCbC_'+idx).forEach(cb=>cb.checked=false);
    document.getElementById('rondaAllC_'+idx).checked=false;
    renderC(idx);
  });
  document.getElementById('modeA_ind_'+idx).addEventListener('change', ()=>renderA(idx));
  document.getElementById('modeA_grp_'+idx).addEventListener('change', ()=>renderA(idx));
  document.getElementById('modeB_ind_'+idx).addEventListener('change', ()=>renderB(idx));
  document.getElementById('modeB_grp_'+idx).addEventListener('change', ()=>renderB(idx));
  document.getElementById('modeC_ind_'+idx).addEventListener('change', ()=>renderC(idx));
  document.getElementById('modeC_grp_'+idx).addEventListener('change', ()=>renderC(idx));

  renderA(idx);
  renderB(idx);
  renderC(idx);
  renderTable(idx);
});

function syncSelAll(allId, cbClass){
  const all = document.querySelectorAll('.'+cbClass);
  const checked = document.querySelectorAll('.'+cbClass+':checked');
  document.getElementById(allId).checked = all.length>0 && all.length===checked.length;
}

function getChecked(cbClass){
  return Array.from(document.querySelectorAll('.'+cbClass+':checked')).map(cb=>parseInt(cb.value));
}

function buildLegend(elId, items){
  const el = document.getElementById(elId);
  el.innerHTML = '';
  items.forEach(it=>{
    const span = document.createElement('span');
    span.style.display='inline-flex'; span.style.alignItems='center'; span.style.gap='4px'; span.style.marginRight='12px'; span.style.fontSize='12px'; span.style.color='#444';
    span.innerHTML = '<span style="width:10px;height:10px;border-radius:2px;background:'+it.color+';display:inline-block;"></span>'+it.label;
    el.appendChild(span);
  });
}

function renderA(idx){
  const dk = periodKeys[idx];
  const D = DATA[dk];
  const selRondas = getChecked('rondaCbA_'+idx);
  const rondaIdx = selRondas.length ? selRondas : D.rondas.map((r,i)=>i);
  const mode = document.getElementById('modeA_grp_'+idx).checked ? 'agrupado' : 'individual';

  let labels, datasets, legendItems;

  if(mode === 'individual'){
    labels = rondaIdx.map(ri => D.rondas[ri]);
    const ofertado = rondaIdx.map(ri => D.rows.filter(r=>r[0]===ri).reduce((a,r)=>a+r[2],0));
    const asignado = rondaIdx.map(ri => D.rows.filter(r=>r[0]===ri).reduce((a,r)=>a+r[3],0));
    const sinasig = rondaIdx.map(ri => D.rows.filter(r=>r[0]===ri).reduce((a,r)=>a+r[5],0));
    datasets = [
      {label:'Vol. Ofertado', data: ofertado, backgroundColor: PALETTE[0]},
      {label:'Vol. Asignado', data: asignado, backgroundColor: PALETTE[2]},
      {label:'Vol. Sin asignar', data: sinasig, backgroundColor: PALETTE[1]}
    ];
    legendItems = [{label:'Vol. Ofertado',color:PALETTE[0]},{label:'Vol. Asignado',color:PALETTE[2]},{label:'Vol. Sin asignar',color:PALETTE[1]}];
  } else {
    labels = ['Total seleccionado'];
    const ofertado = rondaIdx.reduce((a,ri)=>a + D.rows.filter(r=>r[0]===ri).reduce((b,r)=>b+r[2],0), 0);
    const asignado = rondaIdx.reduce((a,ri)=>a + D.rows.filter(r=>r[0]===ri).reduce((b,r)=>b+r[3],0), 0);
    const sinasig = rondaIdx.reduce((a,ri)=>a + D.rows.filter(r=>r[0]===ri).reduce((b,r)=>b+r[5],0), 0);
    datasets = [
      {label:'Vol. Ofertado', data: [ofertado], backgroundColor: PALETTE[0]},
      {label:'Vol. Asignado', data: [asignado], backgroundColor: PALETTE[2]},
      {label:'Vol. Sin asignar', data: [sinasig], backgroundColor: PALETTE[1]}
    ];
    legendItems = [{label:'Vol. Ofertado',color:PALETTE[0]},{label:'Vol. Asignado',color:PALETTE[2]},{label:'Vol. Sin asignar',color:PALETTE[1]}];
  }

  buildLegend('legendA_'+idx, legendItems);

  const key = 'A_'+idx;
  if(charts[key]) charts[key].destroy();
  charts[key] = new Chart(document.getElementById('chartA_'+idx), {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: { title: { display:true, text:'Volumen (m3)' }, beginAtZero:true } },
      plugins: { legend: { display:false } }
    }
  });
}

function renderB(idx){
  const dk = periodKeys[idx];
  const D = DATA[dk];
  const selRondas = getChecked('rondaCbB_'+idx);
  const rondaIdx = selRondas.length ? selRondas : D.rondas.map((r,i)=>i);
  const mode = document.getElementById('modeB_grp_'+idx).checked ? 'agrupado' : 'individual';

  let datasets, legendItems;

  if(mode === 'individual'){
    datasets = rondaIdx.map((ri, i) => {
      const offers = D.rows.filter(r=>r[0]===ri && r[4]!==null).slice().sort((a,b)=>a[4]-b[4]);
      let acc = 0;
      const pts = offers.map(r => { acc += r[2]; return {x: acc, y: r[4]}; });
      const color = PALETTE[i % PALETTE.length];
      return { label: D.rondas[ri], data: pts, borderColor: color, backgroundColor: color+'26', stepped:'before', fill:false, pointRadius:2, tension:0 };
    });
    legendItems = datasets.map((d,i)=>({label:d.label, color: PALETTE[i % PALETTE.length]}));
  } else {
    const offers = D.rows.filter(r=>rondaIdx.includes(r[0]) && r[4]!==null).slice().sort((a,b)=>a[4]-b[4]);
    let acc = 0;
    const pts = offers.map(r => { acc += r[2]; return {x: acc, y: r[4]}; });
    datasets = [{ label:'Curva agrupada (rondas seleccionadas)', data: pts, borderColor: PALETTE[0], backgroundColor: PALETTE[0]+'33', stepped:'before', fill:true, pointRadius:2, tension:0 }];
    legendItems = [{label:'Curva agrupada (rondas seleccionadas)', color:PALETTE[0]}];
  }

  buildLegend('legendB_'+idx, legendItems);

  const key = 'B_'+idx;
  if(charts[key]) charts[key].destroy();
  charts[key] = new Chart(document.getElementById('chartB_'+idx), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type:'linear', title: { display:true, text:'Volumen ofertado acumulado (m3)' } },
        y: { title: { display:true, text:'Precio (USD/MMBTU)' } }
      },
      plugins: { legend: { display:false } }
    }
  });
}

function renderC(idx){
  const dk = periodKeys[idx];
  const D = DATA[dk];
  const selRondas = getChecked('rondaCbC_'+idx);
  const rondaIdx = selRondas.length ? selRondas : D.rondas.map((r,i)=>i);
  const mode = document.getElementById('modeC_grp_'+idx).checked ? 'agrupado' : 'individual';

  // max vol asignado across this period to scale bubble radius
  const maxAsig = Math.max(1, ...D.rows.map(r=>r[3]));
  const radiusFor = v => 3 + (Math.sqrt(v / maxAsig) * 18);

  let datasets, legendItems;

  if(mode === 'individual'){
    datasets = rondaIdx.map((ri, i) => {
      const offers = D.rows.filter(r=>r[0]===ri && r[6] !== null && r[6] !== undefined);
      const pts = offers.map(r => ({ x: r[6], y: r[4], r: radiusFor(r[3]), vol: r[3] }));
      const color = PALETTE[i % PALETTE.length];
      return { label: D.rondas[ri], data: pts, backgroundColor: color+'99', borderColor: color };
    });
    legendItems = datasets.map((d,i)=>({label:d.label, color: PALETTE[i % PALETTE.length]}));
  } else {
    const offers = D.rows.filter(r=>rondaIdx.includes(r[0]) && r[6] !== null && r[6] !== undefined);
    const pts = offers.map(r => ({ x: r[6], y: r[4], r: radiusFor(r[3]), vol: r[3] }));
    datasets = [{ label:'Ofertas (rondas seleccionadas)', data: pts, backgroundColor: PALETTE[0]+'99', borderColor: PALETTE[0] }];
    legendItems = [{label:'Ofertas (rondas seleccionadas)', color:PALETTE[0]}];
  }

  buildLegend('legendC_'+idx, legendItems);

  const key = 'C_'+idx;
  if(charts[key]) charts[key].destroy();
  charts[key] = new Chart(document.getElementById('chartC_'+idx), {
    type: 'bubble',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type:'linear', title: { display:true, text:'Hora del día' }, ticks: { callback: v => fmtHour(v) } },
        y: { title: { display:true, text:'Precio (USD/MMBTU)' } }
      },
      plugins: {
        legend: { display:false },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label} — Hora ${fmtHour(ctx.raw.x)}, Precio ${fmtPrice(ctx.raw.y)} USD/MMBTU, Vol. Asignado ${fmtNum(ctx.raw.vol)} m³`
          }
        }
      }
    }
  });
}

function renderTable(idx){
  const dk = periodKeys[idx];
  const D = DATA[dk];
  const tbl = document.getElementById('detailTable_'+idx);
  let html = '<thead><tr><th>Ronda</th><th>Nro. Oferta</th><th>Vol. Ofertado</th><th>Vol. Asignado</th><th>Precio (USD/MMBTU)</th><th>Vol. Sin asignar</th><th>Hora</th></tr></thead><tbody>';
  D.rows.forEach(r=>{
    html += `<tr><td>${D.rondas[r[0]]}</td><td>${r[1]}</td><td>${fmtNum(r[2])}</td><td>${fmtNum(r[3])}</td><td>${fmtPrice(r[4])}</td><td>${fmtNum(r[5])}</td><td>${fmtHour(r[6])}</td></tr>`;
  });
  html += '</tbody>';
  tbl.innerHTML = html;
}
</script>
</body>
</html>
